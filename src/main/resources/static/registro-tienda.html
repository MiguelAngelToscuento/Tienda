<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro tiendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top-nav">
    <h2 class="logo">Fake shop</h2>
</header>
<di class="forms-wrapper">
    <div class="form-container">
        <h2>Perfil de tu tienda</h2>
        <p style="text-aling: center; font-size: 14px; colot: #666;">Llena los siguientes campos</p>

        <form id="formTienda">
            <div class="form-group">
                <label form="nombreTienda">Nombre de tu negocio:</label>
                <input type="text" id="nombreTienda" required>
            </div>
            <div class="form-group">
                <label for="rfcTienda">RFC:</label>
                <input type="text" id="rfcTienda" required>
            </div>
            <div class="form-group">
                <label for="logoTienda">Logo de tu negocio: </label>
                <input type="file" id="logoTienda" accept="image/*">
            </div>
            <button type="submit">Guardar</button>
        </form>
    </div>
</di>
<script src="tienda.js"></script>
</body>
</html>
