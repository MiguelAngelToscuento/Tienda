<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <!-- Importación de estilos y scripts de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: #f4f6f9;">

    <!-- Barra de navegación del perfil -->
    <header class="top-nav d-flex justify-content-between align-items-center p-3 bg-white shadow-sm sticky-top">
        <h2 class="logo text-primary m-0">Fake Shop</h2>
        <div>
            <a href="catalogo.html" class="btn btn-outline-primary me-2">Volver al Catálogo</a>
            <button id="btnCerrarSesionPerfil" class="btn btn-outline-danger btn-sm">Salir</button>
        </div>
    </header>

    <!-- Contenedor principal -->
    <div class="container mt-5">
        <div class="row">

            <!-- Columna izquierda: Formulario de datos personales -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h5 class="m-0">Mis Datos Personales</h5>
                    </div>
                    <div class="card-body">
                        <form id="formEditarPerfil">
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Nombre Completo</label>
                                <input type="text" class="form-control" id="perfilNombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Teléfono</label>
                                <input type="tel" class="form-control" id="perfilTelefono" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold">Dirección de Envío Principal</label>
                                <textarea class="form-control" id="perfilDireccion" rows="3" required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna derecha: Historial de compras -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="m-0">Mi historial de compras</h5>
                    </div>
                    <div class="card-body bg-light" style="max-height: 70vh; overflow-y: auto;">
                        <!-- Contenedor dinámico para inyectar pedidos -->
                        <div id="listaMisComprasPerfil" class="d-flex flex-column gap-3">
                            <p class="text-center text-muted mt-4">Cargando tus pedidos...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- NUEVO: Modal para calificar producto -->
    <div class="modal fade" id="modalCalificarProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">Calificar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Estás calificando: <strong id="nombreProductoACalificar"></strong></p>
                    <form id="formCalificar">
                        <input type="hidden" id="idProductoCalificar">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tu Calificación</label>
                            <select class="form-select" id="estrellasCalificacion" required>
                                <option value="5">⭐⭐⭐⭐⭐ ¡Excelente!</option>
                                <option value="4">⭐⭐⭐⭐ Muy bueno</option>
                                <option value="3">⭐⭐⭐ Bueno</option>
                                <option value="2">⭐⭐ Regular</option>
                                <option value="1">⭐ Malo</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Cuéntanos más (Opcional)</label>
                            <textarea class="form-control" id="comentarioCalificacion" rows="3"
                                placeholder="¿Qué te pareció el producto?"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <!-- Botón que envía el formulario -->
                    <button type="submit" form="formCalificar" class="btn btn-success">Enviar Reseña</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica principal del perfil -->
    <script src="perfil.js"></script>
</body>

</html>
