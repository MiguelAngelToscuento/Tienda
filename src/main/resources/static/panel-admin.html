<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Superusuario</title>
    <!-- Importación de estilos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Barra de navegación del panel de administración -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Fake Shop | Centro de Administración</span>
        <button id="btnCerrarSesionAdmin" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
    </div>
</nav>

<!-- Contenedor principal de gestión -->
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Gestión de Tiendas</h3>
        <!-- Contador dinámico de negocios registrados -->
        <span class="badge bg-primary fs-6" id="contadorTiendas">0 Negocios Registrados</span>
    </div>

    <!-- Tabla de moderación de tiendas -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped m-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Logo</th>
                    <th>Nombre del Negocio</th>
                    <th>RFC</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones de Moderación</th>
                </tr>
                </thead>
                <!-- Contenedor para inyectar filas dinámicamente -->
                <tbody id="tablaTiendasBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Lógica principal del panel de administración -->
<script src="admin-dashboard.js"></script>

</body>
</html>
