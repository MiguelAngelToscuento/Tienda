<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Superusuario</title>
    <!-- Importación de estilos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!--barra de navegación del panel de administración-->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0g h1">
                Fake Shop Administración
                <button id="btnCerrarSesionAdmin" class="btn btn-outline-light btn-sm">
                    Cerrar Sesión
                </button>
            </span>
        </div>
    </nav>



    <!-- Contenedor principal de gestión -->
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Gestión de Tiendas</h3>
            <!-- Contador dinámico de negocios registrados -->
            <span class="badge bg-primary fs-6" id="contadorTiendas">0 Negocios Registrados</span>
        </div>

        <!-- Tabla de moderación de tiendas -->
        <div class="card shadow-sm">
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover table-striped m-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Logo</th>
                            <th>Nombre del Negocio</th>
                            <th>RFC</th>
                            <th class="text-center">Ventas</th>
                            <th class="text-center">Prestigio</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <!-- Contenedor para inyectar filas dinámicamente -->
                    <tbody id="tablaTiendasBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <!--midal para las suspensiones-->
    <div class="modal fade" id="modalSuspender" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Suspender Tienda</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="midal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Estás a punto de suspender a <strong id="nombreTiendaSuspender"></strong>.</p>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Motivo de suspensión (Se enviará por correo al dueño);</label>
                        <textarea id="motivoSuspension" class="form-control" rows="4"
                            placeholder="Ej. Hemos detectado irregularidades en tus ventas..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarSuspension">Confirmar y Enviar
                        Correo</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica principal del panel de administración -->
    <script src="admin-dashboard.js"></script>

</body>

</html>
