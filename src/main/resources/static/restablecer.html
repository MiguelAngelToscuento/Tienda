<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña - Fake Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <h4 class="text-center text-primary mb-4">Crear Nueva Contraseña</h4>

        <form id="formRestablecer">
            <div class="mb-3">
                <label class="form-label fw-bold">Nueva Contraseña</label>
                <input type="password" id="nuevaPassword" class="form-control" required minlength="6">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Confirmar Contraseña</label>
                <input type="password" id="confirmarPassword" class="form-control" required minlength="6">
            </div>
            <button type="submit" id="btnGuardar" class="btn btn-primary w-100">Guardar Contraseña</button>
        </form>
    </div>

    <!-- Referencia al archivo JavaScript separado -->
    <script src="restablecer.js"></script>
</body>

</html>
