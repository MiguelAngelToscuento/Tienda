<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de la Tienda - Fake Shop</title>
    <!-- Importación de Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tus estilos principales -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Barra de navegación (Puedes reemplazarla por tu header estándar si prefieres) -->
    <header class="top-nav bg-white shadow-sm p-3 mb-4 d-flex justify-content-between align-items-center">
        <h2 class="logo text-primary m-0" style="cursor:pointer;" onclick="window.location.href='catalogo.html'">Fake
            shop</h2>
        <a href="catalogo.html" class="btn btn-outline-secondary btn-sm">← Volver al catálogo</a>
    </header>

    <div class="container my-4">
        <!-- Banner y cabecera de la tienda -->
        <div class="card shadow-sm border-0 mb-4 overflow-hidden">
            <div class="bg-primary"
                style="height: 120px; background-image: linear-gradient(to right, #007bff, #6610f2);"></div>
            <div class="card-body text-center position-relative pt-0 pb-4">
                <!-- Ícono circular flotante -->
                <div class="bg-white rounded-circle shadow-sm d-inline-flex justify-content-center align-items-center overflow-hidden"
                    style="width: 100px; height: 100px; margin-top: -50px; border: 4px solid white; z-index: 2; position: relative;">
                    <img id="imgLogoPerfilTienda" src="https://placehold.co/100x100/eeeeee/333333?text=Tienda"
                        alt="Logo de la tienda" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h2 class="mt-2 fw-bold text-dark" id="tituloTienda">Cargando tienda...</h2>
                <p class="text-muted mb-0">Explora todos los productos de este vendedor</p>
            </div>
        </div>

        <!-- Rejilla de productos -->
        <h4 class="mb-3 text-secondary fw-bold">Productos disponibles</h4>
        <!-- Contenedor dinámico de filtros por categoría -->
        <div id="contenedorFiltrosTienda" class="d-flex gap-2 mb-4 overflow-auto pb-2"></div>
        <div class="row" id="listaProductosTienda">
            <div class="col-12 text-center text-muted mt-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Cargando inventario...</p>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="cliente.js"></script>


    <script src="perfil-tienda.js"></script>
</body>

</html>
