<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashstyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body style="background-color: #f4f6f9">
    <header class="top-nav d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <img id="imgLogoTienda" src="" alt="Logo"
                style="height: 40px; width: 40px; border-radius: 5px; display: none; margin-right: 15px; object-fit: cover;">
            <h2 id="textoNombreTienda" class="logo m-0">Mi Tienda</h2>
        </div>
        <button id="btnCerrarSesion" class="btn btn-outline-danger" style="width: auto;">Cerrar sesión</button>
    </header>

    <div class="container mt-5"
        style="background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 id="tituloDashboard">Gestión de Inventario</h3>
            <div>
                <button class="btn btn-outline-secondary me-2" id="btnVerOrdenes">📦 Ver Pedidos Recibidos</button>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                    data-bs-target="#modalAgregarProducto" id="btnAgregarProd">
                    + Agregar Producto
                </button>
            </div>
        </div>

        <div class="row" id="listaProductos"></div>
        <div class="row" id="listaPedidosRecibidos" style="display: none;"></div>
    </div>

    <!-- Modal Agregar Producto -->
    <div class="modal fade" id="modalAgregarProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalProducto">Registrar un Artículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formProducto">
                        <input type="hidden" id="prodId">
                        <div class="mb-3">
                            <label class="form-label">Nombre del producto:</label>
                            <input type="text" class="form-control" id="prodNombre" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Precio ($):</label>
                                <input type="number" step="0.01" class="form-control" id="prodPrecio" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Cantidad (Stock):</label>
                                <input type="number" class="form-control" id="prodStock" required>
                            </div>
                        </div>
                        <<div class="mb-3">
                            <label class="form-label">Categoría:</label>
                            <input type="text" class="form-control" list="listaCategorias" id="prodCategoria"
                                placeholder="Escribe o selecciona una categoría" required>
                            <datalist id="listaCategorias"></datalist>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción:</label>
                    <textarea class="form-control" id="prodDescripcion" rows="2" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Imagen del producto:</label>
                    <input type="file" class="form-control" id="prodImagen" accept="image/*">
                </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" form="formProducto" class="btn btn-success" id="btnGuardarProd">Guardar
                    Producto</button>
            </div>
        </div>
    </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
