<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: #f4f6f9;">

    <!--barra de navegación principal-->
    <header class="top-nav d-flex justify-content-between align-items-center p-3 bg-white shadow-sm sticky-top">
        <h2 class="logo text-primary m-0" style="cursor:pointer;" onclick="window.location.href='catalogo.html'">Fake
            shop</h2>

        <div class="d-flex align-items-center gap-2 flex-nowrap py-2">
            <button class="btn btn-outline-danger position-relative text-nowrap" data-bs-toggle="offcanvas"
                data-bs-target="#favoritosLateral">
                Favoritos <span id="badgeFavoritos"
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </button>
            <button class="btn btn-outline-primary position-relative text-nowrap" data-bs-toggle="offcanvas"
                data-bs-target="#carritoLateral">
                Mi Carrito <span id="badgeCarrito"
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </button>
            <a href="index.html" class="btn btn-primary text-nowrap" id="btnNavLogin">Iniciar Sesión / Registrarse</a>
            <a href="perfil.html" class="btn btn-outline-info text-nowrap" id="btnNavPerfil" style="display: none;">Mi
                Perfil</a>
            <button id="btnCerrarSesionCat" class="btn btn-outline-danger text-nowrap"
                style="display: none;">Salir</button>
        </div>
    </header>

    <!--contenedor de detalle del producto-->
    <div class="container mt-4 mb-5">

        <a href="catalogo.html" class="btn btn-link text-decoration-none mb-3"><- Volver al catálogo</a>
                <div class="bg-white p-4 mb-4 shadow-sm rounded">
                    <div class="row">
                        <div class="col-md-6 text-center mb-3 mb-md-0">
                            <img id="detalleImagen" src="" class="img-fluid rounded"
                                style="max-height: 400px; object-fit: contain;">
                        </div>
                        <div class="col-md-6 d-flex flex-column justify-content-center">
                            <p class="text-muted small mb-1" id="detalleCategoria"></p>
                            <h3 class="fw-bold mb-2" id="detalleTitulo">Cargando...</h3>
                            <p class="text-primary mb-3 small">Vendido por: <span id="detalleTienda"
                                    class="fw-bold text-decoration-underline"></span></p>
                            <h2 class="text-success mb-3">$<span id="detallePrecio">0.00</span></h2>
                            <p class="mb-4 text-secondary" id="detalleDescripcion"></p>
                            <p class="text-muted small">Unidades disponibles: <span id="detalleStock"
                                    class="fw-bold"></span></p>
                            <button id="btnDetalleAgregarCarrito" class="btn btn-primary btn-lg w-100 shadow-sm">Agregar
                                al carrito</button>
                        </div>
                    </div>
                </div>

                <!--sección de reseñas y productos recomendados-->
                <div class="row">
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0 mb-4">
                            <div class="card-header bg-white pt-3 pb-2">
                                <h5 class="m-0 fw-bold">Opciones sobre el producto</h5>
                            </div>
                            <div class="card-body">
                                <div id="listaResenas" class="mb-4" style="max-height: 300px; overflow-y: auto;">
                                    <p class="text-muted">Cargando reseñas...</p>
                                </div>
                                <hr>
                                <h6 class="fw-bold text-primary">Deja tu opinión</h6>
                                <form id="formResena" class="mt-3">
                                    <input type="hidden" id="resenaProductoId">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Calificación</label>
                                        <select class="form-select" id="resenaCalificacion" required>
                                            <option value="5">⭐⭐⭐⭐⭐ ¡Excelente!</option>
                                            <option value="4">⭐⭐⭐⭐ Muy bueno</option>
                                            <option value="3">⭐⭐⭐ Bueno</option>
                                            <option value="2">⭐⭐ Regular</option>
                                            <option value="1">⭐ Malo</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Cuéntanos más</label>
                                        <textarea class="form-control" id="resenaComentario" rows="3"
                                            placeholder="¿Qué te pareció?" required></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-success">Publicar opinión</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <h6 class="text-muted mb-3 fw-bold">Productos sugeridos: </h6>
                        <div id="listaRecomendados" class="d-flex flex-column gap-3"></div>
                    </div>
                </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cliente.js"></script>
    <script src="detalle.js"></script>
</body>

</html>
