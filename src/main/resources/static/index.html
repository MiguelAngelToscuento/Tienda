<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <!-- Importación de Bootstrap CSS (Requerido para el modal) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Importación de estilos principales -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <!-- Encabezado superior -->
    <header class="top-nav bg-white shadow-sm p-3 mb-4 d-flex justify-content-between align-items-center">
        <h2 class="logo text-primary m-0">Fake shop</h2>
        <!-- Pestañas de selección de rol -->
        <div class="tabs-container" id="botonesRol" style="display: none">
            <button type="button" class="btn btn-outline-primary active" id="tabVendedor"
                onclick="seleccionarRol(2)">Soy Vendedor</button>
            <button type="button" class="btn btn-outline-secondary" id="tabComprador" onclick="seleccionarRol(3)">Soy
                Comprador</button>
        </div>
    </header>

    <!-- Contenedor principal de formularios -->
    <div class="forms-wrapper d-flex justify-content-center">

        <!-- Formulario de registro de nuevos usuarios -->
        <div class="form-container card shadow p-4" id="cajaRegistro"
            style="display: none; width: 100%; max-width: 400px;">
            <h2 class="text-center text-primary mb-3">Registro</h2>
            <input type="hidden" id="regRol" value="2">

            <form id="formRegistro">
                <div class="form-group mb-3">
                    <label for="regCorreo" class="form-label fw-bold">Correo Electrónico:</label>
                    <input type="email" id="regCorreo" class="form-control" required>
                </div>
                <div class="form-group mb-4">
                    <label for="regPassword" class="form-label fw-bold">Contraseña:</label>
                    <input type="password" id="regPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            </form>

            <!-- Enlace para alternar a inicio de sesión -->
            <p class="text-center mt-3 mb-0" style="font-size: 14px">
                ¿Ya tienes cuenta? <a href="#" onclick="mostrarLogin()" class="text-decoration-none">Iniciar sesión</a>
            </p>
        </div>

        <!-- Formulario de inicio de sesión -->
        <div class="form-container card shadow p-4" id="cajaLogin" style="width: 100%; max-width: 400px;">
            <h2 class="text-center text-primary mb-3">Iniciar sesión</h2>
            <form id="formLogin">
                <div class="form-group mb-3">
                    <label for="logCorreo" class="form-label fw-bold">Correo electrónico:</label>
                    <input type="email" id="logCorreo" class="form-control" required>
                </div>
                <div class="form-group mb-2">
                    <label for="logPassword" class="form-label fw-bold">Contraseña:</label>
                    <input type="password" id="logPassword" class="form-control" required>
                </div>
                <div class="text-end mb-4">
                    <a href="#" class="small text-decoration-none" data-bs-toggle="modal"
                        data-bs-target="#modalRecuperar">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <!-- Enlace para alternar a registro -->
            <p class="text-center mt-3 mb-0" style="font-size: 14px">
                ¿No tienes cuenta? <a href="#" onclick="mostrarRegistro()" class="text-decoration-none">Regístrate
                    aquí</a>
            </p>
        </div>
    </div>


    <!-- Modal de Recuperación -->
    <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Recuperar Contraseña</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted">Ingresa el correo electrónico asociado a tu cuenta. Te enviaremos un
                        enlace para que puedas crear una nueva contraseña.</p>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Correo Electrónico</label>
                        <input type="email" id="inputCorreoRecuperacion" class="form-control"
                            placeholder="ejemplo@correo.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnEnviarRecuperacion">Enviar Correo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Importación de Bootstrap JS (Requerido para que el modal funcione al hacer clic) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica de autenticación y navegación -->
    <script src="main.js"></script>

</body>

</html>
