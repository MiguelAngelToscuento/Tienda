<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake Shop Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="bakcground-color: #f4f6f9">

    <!--barra de navegación-->
    <header class="top-nav d-flex justify-content-between align-items-center p-3 bg-white shadow-sm sticky-top">
        <h2 class="logo text-primary m-0">Fake shop</h2>

        <!-- Barra de búsqueda -->
        <div class="mx-auto" style="width: 40%;">
            <input type="text" id="inputBusqueda" class="form-control" placeholder="Buscar productos o categorías">
        </div>

        <div>
            <!-- Botón del Carrito -->
            <button class="btn btn-outline-primary me-3 position-relative" data-bs-toggle="offcanvas" data-bs-target="#carritoLateral">
                Mi Carrito
                <span id="badgeCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </button>
            <button id="btnCerrarSesionCat" class="btn btn-outline-danger btn-sm">Salir</button>
        </div>
    </header>


    <!--malla de productos -->
<div class="container mt-5">
    <h3 class="mb-4 text-muted">Explora nuestros producto</h3>
    <div class="row" id="catalogoGlobal">
        <!-- aqui se inyectan o agregan los produtos-->
    </div>
</div>

    <!--panel lateral para el carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoLateral" aria-labelledby="carritoTitulo">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" id="carritoTitulo">Tu Pedido</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">

            <!-- Lista de items en el carrito -->
            <div id="listaCarrito" class="flex-grow-1 overflow-auto mb-3">
                <p class="text-muted text-center mt-4">El carrito está vacío</p>
            </div>

            <!-- Total y Botón de Pagar -->
            <div class="border-top pt-3">
                <div class="d-flex justify-content-between mb-3">
                    <h5 class="m-0">Total:</h5>
                    <h5 class="m-0 text-success">$<span id="totalCarrito">0.00</span></h5>
                </div>
                <button id="btnPagar" class="btn btn-success w-100 btn-lg">Proceder al Pago</button>
            </div>
        </div>
    </div>


    <script src="cliente.js"></script>
</body>
</html>
